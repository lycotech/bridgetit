services:
  - type: web
    name: paybridge-backend
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # --- Set these in the Render dashboard, never commit real values ---
      # Neon Postgres
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Session / crypto secrets — generate with: openssl rand -base64 48
      - key: SESSION_SECRET
        sync: false
      - key: LOG_SALT
        sync: false
      - key: KYC_ENCRYPTION_KEY
        sync: false
      # CORS/CSRF — the Vercel domain(s) this backend is served behind
      - key: ALLOWED_ORIGINS
        sync: false
      # S3-compatible object storage for KYC documents
      - key: KYC_S3_BUCKET
        sync: false
      - key: KYC_S3_REGION
        sync: false
      - key: KYC_S3_ACCESS_KEY_ID
        sync: false
      - key: KYC_S3_SECRET_ACCESS_KEY
        sync: false
      - key: KYC_S3_ENDPOINT
        sync: false
      - key: KYC_S3_FORCE_PATH_STYLE
        sync: false
      # Admin dashboard
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # Outbound mail (optional — falls back to log-only if unset)
      - key: MAIL_TRANSPORT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SECURE
        sync: false
      # Optional
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
